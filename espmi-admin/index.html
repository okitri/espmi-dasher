  <body class="auth-bg">
    <main class="d-flex flex-column justify-content-center vh-100">
      <!--Sign up start-->
      <section>
        <div class="container">
          <div class="row mb-8">
            <div class="col-xl-4 offset-xl-4 col-md-12 col-12">
              <div class="text-center">
                <span class="fs-2 fw-bold d-flex align-items-center gap-2 justify-content-center mb-6">
                  <img src="../dist/assets/images/brand/logo/logo-icon.svg" alt="" />
                  <span>eSPMI</span>
                </span>
                <div>
                  <img src="../dist/assets/images/brand/logo/img-campus-logo.png" width="120" alt=""/>
                  <h3 class="mb-1">Universitas Solusi Kampus Indonesia</h3>
                </div>
              </div>
            </div>
          </div>
          <div class="row justify-content-center">
            <div class="col-xl-5 col-lg-6 col-md-8 col-12">
              <div class="card card-lg mb-6">
                <div class="card-body p-6">
                  <form action="dashboard.html" method class="needs-validation mb-6" novalidate>
                    <div class="mb-3">
                      <label for="signinEmailInput" class="form-label">
                        Username
                        <span class="text-danger">*</span>
                      </label>
                      <input type="text" class="form-control" id="signinEmailInput" required />
                      <div class="invalid-feedback">Please enter username.</div>
                    </div>
                    <div class="mb-3">
                      <label for="formSignUpPassword" class="form-label">Password</label>
                      <div class="password-field position-relative">
                        <input type="password" class="form-control fakePassword" id="formSignUpPassword" required />
                        <span><i class="ti ti-eye-off passwordToggler"></i></span>
                        <div class="invalid-feedback">Please enter password.</div>
                      </div>
                    </div>

                    <!-- security check -->
                    <div class="mb-3" data-math-captcha>
                      <label for="signinCaptchaInput" class="form-label">
                        Security Check
                        <span class="text-danger">*</span>
                      </label>
                      <div class="d-flex align-items-center gap-2">
                        <span
                          class="bg-primary-subtle text-primary-emphasis fw-semibold rounded-2 px-3 py-2 text-nowrap"
                          data-math-captcha-question
                          aria-live="polite"
                        ></span>
                        <div class="flex-grow-1 position-relative">
                          <input
                            type="text"
                            class="form-control"
                            id="signinCaptchaInput"
                            inputmode="numeric"
                            autocomplete="off"
                            placeholder="Answer"
                            required
                            data-math-captcha-input
                          />
                          <div class="invalid-feedback">Please solve the security check correctly.</div>
                        </div>
                        <button class="btn btn-ghost btn-icon rounded-circle" type="button" data-math-captcha-refresh aria-label="New question">
                          <i class="ti ti-refresh fs-5"></i>
                        </button>
                      </div>
                    </div>

                    <div class="d-grid">
                      <button class="btn btn-primary" type="submit">Sign In</button>
                    </div>
                  </form>

                </div>
              </div>
              <p class="text-center text-gray-800">© 2021 PT. Solusi Kampus Indonesia</p>
            </div>
          </div>
        </div>
      </section>
      <!--Sign up end-->
      <div class="position-absolute end-0 bottom-0 m-4">
        <div class="dropdown">
          <button class="btn btn-light btn-icon rounded-circle d-flex align-items-center" type="button" aria-expanded="false" data-bs-toggle="dropdown" aria-label="Toggle theme (auto)">
            <i class="bi theme-icon-active lh-1"><i class="bi theme-icon bi-sun-fill"></i></i>
            <span class="visually-hidden bs-theme-text">Toggle theme</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow">
            <li>
              <button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="light" aria-pressed="true">
                <i class="ti theme-icon ti ti-sun"></i>
                <span class="ms-2">Light</span>
              </button>
            </li>
            <li>
              <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark" aria-pressed="false">
                <i class="ti theme-icon ti-moon-stars"></i>
                <span class="ms-2">Dark</span>
              </button>
            </li>
            <li>
              <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="auto" aria-pressed="false">
                <i class="ti theme-icon ti-circle-half-2"></i>
                <span class="ms-2">Auto</span>
              </button>
            </li>
          </ul>
        </div>
      </div>
